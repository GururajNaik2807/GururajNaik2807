<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 290 270" width="290" height="270" role="img" aria-label="Codetoanim mission card">
<title>Codetoanim mission card</title>
<defs>
<radialGradient id="iris" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff5a5f"/><stop offset=".55" stop-color="#e11d2e"/><stop offset="1" stop-color="#8a0b14"/></radialGradient>
<radialGradient id="aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e11d2e" stop-opacity=".55"/><stop offset="1" stop-color="#e11d2e" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
<path id="tomoe" d="M-1 0 C-.8 -1.8 1.8 -2.6 3.6 -1.4 C2 -1.6 1 -.8 1 0 A1 1 0 0 1 -1 0Z"/>
<path id="feather" d="M0 0 C5 -9 7 -22 0 -38 C-7 -22 -5 -9 0 0Z" fill="#0b0b10" stroke="#e11d2e" stroke-opacity=".55" stroke-width=".9"/>
<path id="cloud" d="M0 26 C-14 26 -16 8 -2 5 C0 -10 22 -14 28 -2 C38 -10 56 -2 50 12 C62 14 60 30 46 30 L6 30 C2 30 0 28 0 26Z" fill="#e11d2e" stroke="#f3f1f4" stroke-width="2.2"/>
<clipPath id="cc"><path d="M0 14 L14 0 H276 L290 14 V256 L276 270 H14 L0 256Z"/></clipPath>
<style>.fe{animation-name:fe;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes fe{0%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(40px,68px) rotate(80deg)}50%{transform:translate(-30px,135px) rotate(170deg)}75%{transform:translate(35px,202px) rotate(260deg)}100%{transform:translate(-10px,390px) rotate(350deg)}}.bd{animation:bd 3s ease-in-out infinite}@keyframes bd{50%{stroke-opacity:.35}}</style></defs>
<path d="M0 14 L14 0 H276 L290 14 V256 L276 270 H14 L0 256Z" fill="#0d0a11"/>
<g clip-path="url(#cc)">
<g opacity=".09"><use xlink:href="#cloud" transform="translate(20 150) scale(1.5)"/><use xlink:href="#cloud" transform="translate(170 60) scale(1.2)"/><use xlink:href="#cloud" transform="translate(120 225) scale(1.1)"/><animateTransform attributeName="transform" type="translate" values="-30 0;30 0;-30 0" dur="14s" repeatCount="indefinite"/></g>
<circle cx="245" cy="40" r="90" fill="url(#aura)"/>
<g transform="translate(181 -50) scale(0.95)"><g class="fe" style="animation-duration:10.2s;animation-delay:-9.6s"><use xlink:href="#feather"/></g></g><g transform="translate(215 -50) scale(1.05)"><g class="fe" style="animation-duration:7.1s;animation-delay:-3.3s"><use xlink:href="#feather"/></g></g><g transform="translate(274 -50) scale(0.89)"><g class="fe" style="animation-duration:10.6s;animation-delay:-1.2s"><use xlink:href="#feather"/></g></g><g transform="translate(136 -50) scale(0.65)"><g class="fe" style="animation-duration:9.2s;animation-delay:-5.3s"><use xlink:href="#feather"/></g></g>
</g>
<path class="bd" d="M0 14 L14 0 H276 L290 14 V256 L276 270 H14 L0 256Z" fill="none" stroke="#e11d2e" stroke-width="2"/>
<text x="22" y="30" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#8a0b14" letter-spacing="3">MISSION 02</text>
<g transform="translate(236 14)"><circle cx="20" cy="20" r="19" fill="#14090e" stroke="#e11d2e" stroke-width="2"/><text x="20" y="28" text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', 'Segoe UI', sans-serif" font-size="22" fill="#e11d2e">A</text></g>
<text x="22" y="74" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', 'Segoe UI', sans-serif" font-size="30" letter-spacing="2" fill="#f3f1f4">CODETOANIM</text>
<text x="22" y="95" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#e11d2e">python code visualizer</text>
<path d="M22 106 H268" stroke="#8a0b14" stroke-opacity=".6"/>
<text x="22" y="128" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#d0ccd6">Animates algorithms step by step</text><text x="22" y="147" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#d0ccd6">so learners see every line run,</text><text x="22" y="166" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#d0ccd6">with play, pause and step.</text>
<rect x="22" y="204" width="58.0" height="22" fill="#14090e" stroke="#e11d2e" stroke-opacity=".7"/><text x="51.0" y="219" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#f3f1f4">Python</text><rect x="88.0" y="204" width="86.0" height="22" fill="#14090e" stroke="#e11d2e" stroke-opacity=".7"/><text x="131.0" y="219" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#f3f1f4">JavaScript</text><rect x="182.0" y="204" width="58.0" height="22" fill="#14090e" stroke="#e11d2e" stroke-opacity=".7"/><text x="211.0" y="219" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#f3f1f4">Canvas</text>
<text x="22" y="252" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#e11d2e">▶ live demo</text>
</svg>
